# dsh-pet-voice bundle patch.
#
# 把「语音控制桌宠」挂进 DSH 配置树。
#
# 链路（全程在宿主进程，不经过浏览器）：
#   1. 往 dsh-pet 的右键菜单注册一项「语音控制」（owner=dsh-pet-voice, target=desktop）
#   2. 轮询 /menu/events 等点击
#   3. 点了就调 python/record.py 录音（WASAPI，4ch/48k/float32 → 16kHz 单声道 PCM16 WAV）
#   4. 直接把 WAV 发给 https://api.deepseek.com/v1/tools/asr，拿回 { request_id, text, duration_ms }
#   5. 把 text 解析成指令，调 /anim、/sleep、/wake、/position、/throw 驱动桌宠
#
# 识别不经 dsh-pet 中转，直接打 DeepSeek 官方接口；鉴权用 DSH 凭据里的
# DEEPSEEK_API_KEY（经 ctx.credentials 现取，用完即弃，不缓存、不落盘、不打日志）。
#
# 为什么录音在宿主侧而不是浏览器：
#   宠物在桌面 Electron 窗口里，那个窗口加载的是 dsh-pet 自己的页面，没有本插件的代码；
#   而宿主侧录音不依赖页面是否打开、不需要用户手势，右键点完就开始录。
#
# 为什么用 Python：
#   这台机器的麦克风原生格式是 4 声道 / 48000 Hz / 32 位浮点（WAVE_FORMAT_EXTENSIBLE），
#   Windows 的 waveIn 老接口协商会"成功"但一个采样都录不到。必须走 WASAPI 拿原生格式
#   再自己重采样，而 Node 没有现成的 Windows 音频库。Python 用 ctypes 调 COM 即可，零第三方依赖。
#
# 除语音外，本插件还借 dsh-pet 的 petApi7340.memory.register 挂了一个记忆后端，
# 把「对话控制」接进 dsh-pet 自带的聊天：对话前（recall）往 system 里追加控制指令，
# 对话落盘后（capture）解析 [控制:sleep] / [控制:move-right] 这类标记并调对应端点执行。
# dsh-pet 自带的 [动作:名称] 只能播动画，睡觉 / 走动 / 抛掷走的是另外的端点，插不进去。
#
# Python 解释器路径可在环境变量 DSH_PET_VOICE_PYTHON 里覆盖；不设则自动探测。

- insert:
    - id: dsh-pet-voice
      name: 'dsh-pet-voice'
